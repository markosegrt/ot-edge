# docker-compose.yml
services:

  # ---- Simulator postrojenja: jedan mozak, Modbus :502 + OPC UA :4840 ----
  plant:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    command: python -m simulator.plant_server
    environment:
      PYTHONUNBUFFERED: "1"
      MODBUS_PORT: 502
      OPCUA_PORT: 4840
    networks:
      otlab:
        ipv4_address: 192.168.10.10

  # ---- HMI klijent: čita često, povremeno komanduje ----
  hmi-sim:
    build:
      context: .
      dockerfile: clients/Dockerfile
    command: python -m clients.modbus_client
    environment:
      PYTHONUNBUFFERED: "1"
      PROFIL: hmi
      MODBUS_HOST: 192.168.10.10
      MODBUS_PORT: 502
      HMI_VEROVATNOCA_KOMANDE: ${HMI_VEROVATNOCA_KOMANDE:-0.05}
    depends_on:
      - plant
    networks:
      otlab:
        ipv4_address: 192.168.10.20

  # ---- SCADA klijent: čita ređe, širi opseg ----
  scada-sim:
    build:
      context: .
      dockerfile: clients/Dockerfile
    command: python -m clients.modbus_client
    environment:
      PYTHONUNBUFFERED: "1"
      PROFIL: scada
      MODBUS_HOST: 192.168.10.10
      MODBUS_PORT: 502
    depends_on:
      - plant
    networks:
      otlab:
        ipv4_address: 192.168.10.30

  # ---- Baza: PostgreSQL 16 ----
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: otedge
      POSTGRES_PASSWORD: otedge
      POSTGRES_DB: otedge
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      otlab:
        ipv4_address: 192.168.10.40

  # ---- Edge: sniffi uzivo (deli plant namespace), cita OPC UA, primenjuje pravila ----
  ot-edge:
    build:
      context: .
      dockerfile: edge/Dockerfile
    command: python -m edge.main
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: 192.168.10.40
      DB_PORT: 5432
      DB_USER: otedge
      DB_PASSWORD: otedge
      DB_NAME: otedge
      OPCUA_HOST: 192.168.10.10
      OPCUA_PORT: 4840
      OPCUA_PATH: /otedge/
      NETWORK_SOURCE: pcap
      PCAP_PATH: tests/pcaps/pair.pcap
      PROCESS_SOURCE: file
      TELEMETRY_PATH: tests/telemetry/pair_telemetry.jsonl
      BASELINE_PATH: baseline.yaml
      RULES_PATH: rules.yaml
      CORRELATION_ENABLED: ${CORRELATION_ENABLED:-true}
    volumes:
      - ./edge:/app/edge
      - ./baseline.yaml:/app/baseline.yaml
      - ./rules.yaml:/app/rules.yaml
      - ./tests:/app/tests
    depends_on:
      - plant
      - db
    networks:
      otlab:
        ipv4_address: 192.168.10.50

  # ---- Rogue simulator: napada PLC, HMI, SCADA ----
  rogue-sim:
    build:
      context: .
      dockerfile: attacker/Dockerfile
    command: python -m attacker.attacks
    environment:
      PYTHONUNBUFFERED: "1"
      TARGET_HOST: 192.168.10.10
      ATTACK: all
    networks:
      otlab:
        ipv4_address: 192.168.10.99
    profiles:
      - attack

networks:
  otlab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24

volumes:
  db_data: